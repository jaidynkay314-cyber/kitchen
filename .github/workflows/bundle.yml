name: Bundle recipes
on:
  push:
    paths: ["recipes/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/bundle.py
      - name: Commit the bundle if it changed
        run: |
          git config user.name "kitchen-bot"
          git config user.email "kitchen-bot@users.noreply.github.com"
          git add data/recipes.js
          git diff --cached --quiet || (git commit -m "Bundle recipes" && git push)
